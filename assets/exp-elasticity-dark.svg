<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-label="Promo Elasticity &amp; Pricing Simulator — Uplift-vs-discount curves, what-if price simulations and profit-optimal discounts for FMCG"><title>Promo Elasticity &amp; Pricing Simulator — Uplift-vs-discount curves, what-if price simulations and profit-optimal discounts for FMCG</title><style>
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
