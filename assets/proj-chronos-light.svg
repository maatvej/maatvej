<svg xmlns="http://www.w3.org/2000/svg" width="490" height="226" viewBox="0 0 490 226" role="img" aria-label="Chronos-T5 Fine-Tuning — Full fine-tuning of Chronos-T5-Large for retail sales: 14.9M rows → 182K series, streamed training, probabilistic WAPE evaluation."><title>Chronos-T5 Fine-Tuning — Full fine-tuning of Chronos-T5-Large for retail sales: 14.9M rows → 182K series, streamed training, probabilistic WAPE evaluation.</title><style>
